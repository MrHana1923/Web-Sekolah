<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAWALIB - Berita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">PP THAWALIB TANJUNG LIMAU</div>
        <ul class="menu">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="berita.html">Berita</a></li>
            <li><a href="guru.html">Guru</a></li>
            <li><a href="galeri.html">Galeri</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <section class="page-header">
        <h1>Berita & Pengumuman</h1>
        <p>Informasi terbaru seputar kegiatan sekolah</p>
    </section>

    <section class="content">
        <div class="card-container" id="berita-container">
    <p>Memuat berita...</p>
</div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 PP THAWALIB TANJUNG LIMAU. All rights reserved.</p>
    </footer>
<script>
    // GANTI URL INI dengan URL backend Vercel kamu
    const API_URL = 'https://web-sekolah-1.vercel.app/api/berita';

    fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('berita-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p>Belum ada berita.</p>';
                return;
            }

            data.forEach(berita => {
                const tanggal = new Date(berita.tanggal).toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });

                const card = `
                    <div class="card">
                        <span class="tanggal">${tanggal}</span>
                        <h3>${berita.judul}</h3>
                        <p>${berita.konten}</p>
                    </div>
                `;
                container.innerHTML += card;
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('berita-container').innerHTML =
                '<p>Gagal memuat berita. Coba lagi nanti.</p>';
        });
</script>
</body>
</html>
